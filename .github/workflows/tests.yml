name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rl-offline:
    name: RL experiment / offline Lua and Gym adapter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install CPU-only training dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . -r experiments/rl/requirements.txt lupa==2.8
      - name: Check RL rewards, datasets, evaluation and bounded worker cleanup
        run: python -m unittest experiments.rl.test_rl experiments.rl.test_runtime experiments.rl.test_collect experiments.rl.test_dataset experiments.rl.test_train -v
  windows-lua-status-io:
    name: Windows / real Lua I/O and speed
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install built wheel and test-only Lua runtime
        run: python -c "from pathlib import Path; import subprocess, sys; wheels=list(Path('dist').glob('astra_play_sf2-*.whl')); assert len(wheels)==1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheels[0]), 'lupa'])"
      - name: Verify Lua publication and speed guards
        run: python tests/windows_status_io.py
  unit-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install built wheel
        run: python -c "from pathlib import Path; import subprocess, sys; wheels=list(Path('dist').glob('astra_play_sf2-*.whl')); assert len(wheels)==1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheels[0])])"
      - name: CLI help
        run: astra-sf2 --help
      - name: Unit tests (no emulator or ROM required)
        run: python -m unittest discover -s tests -v
      - name: Parse Bash bootstrap
        if: runner.os != 'Windows'
        run: bash -n scripts/bootstrap.sh
      - name: Parse PowerShell bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/bootstrap.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }
