name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install built wheel
        run: python -c "from pathlib import Path; import subprocess, sys; wheels=list(Path('dist').glob('astra_play_sf2-*.whl')); assert len(wheels)==1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheels[0])])"
      - name: CLI help
        run: astra-sf2 --help
      - name: Unit tests (no emulator or ROM required)
        run: python -m unittest discover -s tests -v
      - name: Parse Bash bootstrap
        if: runner.os != 'Windows'
        run: bash -n scripts/bootstrap.sh
      - name: Parse PowerShell bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/bootstrap.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }
