[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-play-sf2"
version = "0.1.3"
description = "Standalone MAME SF2 Ken verification with a frozen Lua policy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
astra-sf2 = "astra_play_sf2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
astra_play_sf2 = ["assets/*.lua", "assets/*.json"]
